<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmare beneficiu — Lokal</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{ --bg:#EAE3D3; --surface:#FBF8F1; --ink:#20291F; --ink-soft:#5B6459;
    --spruce:#3C5B44; --spruce-deep:#26382C; --amber:#B9812F; --brick:#9C4536; --line:rgba(32,41,31,0.14); }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Inter', system-ui, sans-serif; padding:24px 16px;}
  .wrap{max-width:480px; margin:0 auto;}
  h1{font-family:'Fraunces', Georgia, serif; font-size:22px; margin:0 0 4px;}
  .biz-name{color:var(--spruce); font-weight:600; font-size:15px; margin-bottom:20px;}
  #reader{width:100%; border-radius:16px; overflow:hidden; border:1px solid var(--line);}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px; margin-top:16px;}
  .row{display:flex; justify-content:space-between; font-size:14px; margin-bottom:8px;}
  .row b{color:var(--spruce-deep);}
  .btn{width:100%; padding:14px; border:none; border-radius:999px; font-size:15px; font-weight:600;
    cursor:pointer; margin-top:12px;}
  .btn-confirm{background:var(--spruce-deep); color:#fff;}
  .btn-again{background:transparent; color:var(--spruce); border:1px solid var(--spruce);}
  .status{padding:14px 16px; border-radius:12px; font-size:14px; margin-top:16px; font-weight:500;}
  .status.ok{background:#E8F0E9; color:var(--spruce-deep);}
  .status.err{background:#F5E4E0; color:var(--brick);}
  .mono{font-family:'JetBrains Mono', monospace;}
</style>
</head>
<body>
<div class="wrap">
  <h1>📷 Confirmare beneficiu</h1>
  <div class="biz-name" id="biz-name">Se încarcă...</div>

  <div id="reader"></div>
  <div id="result-area"></div>
</div>

<script>
const SUPABASE_URL = "https://mwtodfcwuwzgnkohxpwi.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_5I9zz5OjPkB7yuew0cWBVA_mmmxSjhf";
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT_LbOENmZHd9d5su2EOTaqVcqDgwUfD6xBfltgKGG8326YnWApHtmv4ZNRJB3N40Yj902RfUM1Dexf/pub?gid=1395207386&single=true&output=csv";

const params = new URLSearchParams(window.location.search);
const businessId = (params.get('business') || '').trim();
let businessName = businessId;

async function loadBusinessName() {
  try {
    const res = await fetch(SHEET_CSV_URL);
    const csvText = await res.text();
    const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
    const row = parsed.data.find(r => (r.id || '').trim() === businessId);
    if (row) businessName = row.nume;
  } catch (e) { /* fallback la id */ }
  document.getElementById('biz-name').textContent = businessId ? businessName : 'Lipsește parametrul ?business= din link';
}

async function sbFetch(path, options = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': options.prefer || 'return=representation',
      ...(options.headers || {}),
    },
  });
  return res;
}

function showStatus(html, ok) {
  document.getElementById('result-area').innerHTML =
    `<div class="status ${ok ? 'ok' : 'err'}">${html}</div>
     <button class="btn btn-again" onclick="location.reload()">Scanează alt cod</button>`;
}

async function handleScannedCode(code) {
  code = code.trim().toUpperCase();
  scanner.pause(true);

  // 1. Caută codul
  const res = await sbFetch(`guest_codes?code=eq.${encodeURIComponent(code)}&select=*`);
  const rows = await res.json();
  if (!rows || rows.length === 0) {
    showStatus('❌ Cod invalid — nu există în sistem.', false);
    return;
  }
  const gc = rows[0];

  // 2. Verifică valabilitatea
  if (new Date(gc.valid_until) < new Date()) {
    showStatus('⏰ Acest cod a expirat.', false);
    return;
  }
  if (gc.scope_business_id && gc.scope_business_id !== businessId) {
    showStatus('⚠️ Acest cod e valabil doar la altă afacere.', false);
    return;
  }

  // 3. Arată confirmarea
  document.getElementById('result-area').innerHTML = `
    <div class="card">
      <div class="row"><span>Apartament</span><b>${gc.apt_name}</b></div>
      <div class="row"><span>Cod</span><b class="mono">${gc.code}</b></div>
      <button class="btn btn-confirm" id="confirm-btn">Confirmă acordarea beneficiului</button>
    </div>
  `;
  document.getElementById('confirm-btn').onclick = () => confirmRedemption(gc.id);
}

async function confirmRedemption(codeId) {
  const res = await sbFetch('redemptions', {
    method: 'POST',
    body: JSON.stringify({ code_id: codeId, business_id: businessId }),
  });
  if (res.status === 201) {
    showStatus('✅ Beneficiu confirmat cu succes!', true);
  } else if (res.status === 409) {
    showStatus('⚠️ Acest cod a fost deja folosit la voi.', false);
  } else {
    const err = await res.text();
    showStatus('❌ A apărut o eroare: ' + err, false);
  }
}

let scanner;
function startScanner() {
  scanner = new Html5Qrcode("reader");
  scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 240 },
    (decodedText) => handleScannedCode(decodedText),
    () => {}
  );
}

loadBusinessName();
startScanner();
</script>
</body>
</html>
