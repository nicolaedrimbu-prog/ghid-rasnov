<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghidul gazdei — Râșnov</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root{
    --bg:#EAE3D3; --surface:#FBF8F1; --ink:#20291F; --ink-soft:#5B6459;
    --spruce:#3C5B44; --spruce-deep:#26382C; --amber:#B9812F; --amber-deep:#8F6222;
    --slate:#57727C; --brick:#9C4536; --line:rgba(32,41,31,0.14);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Inter', system-ui, sans-serif;}
  .serif{font-family:'Fraunces', Georgia, serif;}

  header{padding:32px 20px 20px; max-width:960px; margin:0 auto;}
  .eyebrow{display:flex; align-items:center; gap:8px; color:var(--amber-deep);
    font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.12em; margin-bottom:6px;}
  h1{font-size:28px; font-weight:600; margin:0 0 4px; line-height:1.15;}
  #welcome{font-size:14px; color:var(--spruce); font-weight:600; margin:0 0 8px;}
  header p{font-size:14px; color:var(--ink-soft); max-width:480px; margin:0;}

  nav{max-width:960px; margin:0 auto; padding:0 20px 16px; display:flex; gap:8px; flex-wrap:wrap;}
  .chip{border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
    padding:7px 14px; border-radius:999px; font-size:13px; font-weight:500; cursor:pointer; transition:.15s;}
  .chip.active{background:var(--spruce); color:#fff; border-color:var(--spruce);}

  main{max-width:960px; margin:0 auto; padding:8px 20px 60px;}
  .grid{display:grid; grid-template-columns:1fr; gap:14px;}
  @media(min-width:640px){ .grid{grid-template-columns:1fr 1fr;} }

  .card{background:var(--surface); border:1px solid var(--line); border-radius:18px; overflow:hidden; display:flex; flex-direction:column;}
  .card-top{height:104px; display:flex; align-items:center; justify-content:center; font-size:44px;}
  .card-body{padding:16px;}
  .card-title{font-size:16px; font-weight:600; margin:0; line-height:1.25;}
  .cat-badge{display:inline-block; font-size:11px; font-weight:500; padding:3px 9px; border-radius:999px; margin-top:6px;}
  .desc{font-size:13px; color:var(--ink-soft); margin:10px 0 0; line-height:1.45;}

  .actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
  .btn{font-size:12px; font-weight:500; padding:7px 12px; border-radius:999px; text-decoration:none;
    display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line); color:var(--ink);}
  .btn.primary{background:var(--spruce-deep); color:#fff; border-color:var(--spruce-deep);}
  .btn.phone{background:transparent; color:var(--slate); border-color:var(--slate);}
  .btn.social{padding:7px 10px; font-size:14px; border-color:var(--line); width:32px; height:32px; justify-content:center;}
  .btn.social.inactive{opacity:0.32; cursor:default; filter:grayscale(1);}
  .btn.social.facebook{color:#1877F2; border-color:#1877F220;}
  .btn.social.instagram{color:#E1306C; border-color:#E1306C20;}

  footer{max-width:960px; margin:0 auto; padding:0 20px 40px; color:var(--ink-soft); font-size:12px;}
  footer .box{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px;}
</style>
</head>
<body>

<header>
  <div class="eyebrow">🔥 Ghid de oaspeți · Râșnov</div>
  <h1 class="serif">Recomandările gazdei</h1>
  <p id="welcome"></p>
  <p>O selecție de afaceri locale — activități, cultură, wellness și gastronomie, alese pentru sejurul tău.</p>
</header>

<nav id="filters"></nav>

<main>
  <div class="grid" id="grid">
    <p style="color:var(--ink-soft); font-size:13px; grid-column:1/-1;">Se încarcă recomandările…</p>
  </div>
</main>

<footer>
  <div class="box">
    <p style="margin:0 0 10px; font-weight:600; color:var(--ink);">Ai nevoie de o recomandare care nu e în listă?</p>
    <textarea id="feedback-text" rows="3" placeholder="Scrie aici sugestia ta — o citim și actualizăm ghidul."
      style="width:100%; box-sizing:border-box; border:1px solid var(--line); border-radius:10px; padding:10px 12px;
        font-family:'Inter', sans-serif; font-size:13px; color:var(--ink); resize:vertical;"></textarea>
    <button id="feedback-send" onclick="sendFeedback()"
      style="margin-top:10px; background:var(--spruce-deep); color:#fff; border:none; border-radius:999px;
        padding:9px 18px; font-size:13px; font-weight:500; cursor:pointer; display:inline-flex; align-items:center; gap:6px;">
      Trimite pe WhatsApp
    </button>
  </div>
</footer>

<script>
// ---------- Apartment identity + visit counter (lightweight, no backend) ----------
const params = new URLSearchParams(window.location.search);
const apt = params.get('apt') || 'general';
const APT_NAMES = {
  ap5:    { name: 'Apartamentul 5 — Beautiful views near the Fortress', zona: 'rasnov', telefon: '40751090407' },
  ap12:   { name: 'Apartamentul 12 — Peaceful and inviting', zona: 'rasnov', telefon: '40751090407' },
  sacele: { name: 'Family House with mountain views', zona: 'sacele-brasov', telefon: '40721372770' },
};
const currentApt = APT_NAMES[apt];
const currentZona = currentApt ? currentApt.zona : 'rasnov'; // implicit Râșnov, pt link-uri vechi
document.getElementById('welcome').textContent = currentApt ? `Bun venit — ${currentApt.name}` : '';

function sendFeedback(){
  const text = document.getElementById('feedback-text').value.trim();
  if (!text) {
    document.getElementById('feedback-text').focus();
    return;
  }
  const apartmentLabel = currentApt ? currentApt.name : 'ghid';
  const phone = currentApt ? currentApt.telefon : '40751090407';
  const message = `Salut! Sunt oaspete la "${apartmentLabel}" și am o sugestie pentru ghid: ${text}`;
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
}

// Free, no-signup hit counter (community revival of countapi.xyz). Best-effort —
// if the service is ever down, the page still works fully, just without the count.
fetch(`https://countapi.mileshilliard.com/api/v1/hit/ghid-rasnov-${apt}`).catch(()=>{});

// ---------- Categorii ----------
const CATS = {
  aventura:  { label: "Aventură",     color: "#3C5B44" },
  cultura:   { label: "Cultură",      color: "#8F6222" },
  wellness:  { label: "Wellness",     color: "#57727C" },
  gastro:    { label: "Gastronomie",  color: "#9C4536" },
  livrare:   { label: "Livrare",      color: "#B9812F" },
  facilitare:{ label: "Facilitare",   color: "#7A6C5D" },
};

// ---------- Date live din Google Sheets ----------
// Link-ul de mai jos e cel primit de la "File → Share → Publish to web" (format CSV),
// pentru tab-ul "Afaceri" din baza de date. Se poate schimba oricând fără alt cod.
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT_LbOENmZHd9d5su2EOTaqVcqDgwUfD6xBfltgKGG8326YnWApHtmv4ZNRJB3N40Yj902RfUM1Dexf/pub?gid=1395207386&single=true&output=csv";

const CATEGORII_VALIDE = new Set(Object.keys(CATS));
let PLACES = [];

function rowToPlace(row) {
  const activ = (row.activ || "").trim().toLowerCase();
  if (activ === "nu") return null; // ascunsă manual din Sheets

  const zonaRaw = (row.zona || "").trim().toLowerCase() || "rasnov"; // implicit Râșnov pt rândurile vechi
  const zoneList = zonaRaw.split(",").map(z => z.trim()).filter(Boolean);
  if (!zoneList.includes(currentZona)) return null; // nu e din zona apartamentului curent

  const cat = (row.categorie || "").trim();
  if (!CATEGORII_VALIDE.has(cat)) return null; // rând gol/invalid, sărit

  const photos = [row.poza_1, row.poza_2].map(p => (p || "").trim()).filter(Boolean);

  const ordineRaw = (row.ordine || "").trim();
  const ordine = ordineRaw && !isNaN(Number(ordineRaw)) ? Number(ordineRaw) : Infinity; // fără cifră = la coadă

  return {
    name: (row.nume || "").trim(),
    cat,
    icon: (row.iconita_fallback || "📍").trim(),
    desc: (row.descriere || "").trim(),
    website: (row.website || "").trim() || null,
    facebook: (row.facebook || "").trim() || null,
    instagram: (row.instagram || "").trim() || null,
    phone: (row.telefon || "").trim() || null,
    mapsId: (row.google_maps_place_id || "").trim() || null,
    photos: photos.length ? photos : undefined,
    ordine,
  };
}

async function loadPlaces() {
  try {
    const res = await fetch(SHEET_CSV_URL);
    const csvText = await res.text();
    const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
    PLACES = parsed.data.map(rowToPlace).filter(Boolean);
    // Sortare: cele cu "ordine" completat vin primele, în ordine crescătoare;
    // restul rămân în ordinea din Sheets (stable sort), la coadă.
    PLACES.sort((a, b) => a.ordine - b.ordine);
  } catch (e) {
    document.getElementById('grid').innerHTML =
      '<p style="color:var(--brick); font-size:13px; grid-column:1/-1;">Nu am putut încărca recomandările chiar acum. Încearcă să reîmprospătezi pagina.</p>';
    return;
  }
  renderFilters();
  render('toate');
}

function mapsUrl(p){ return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name + ' Rasnov Brasov')}&query_place_id=${p.mapsId}`; }

function render(filter){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const list = filter === 'toate' ? PLACES : PLACES.filter(p => p.cat === filter);
  list.forEach(p => {
    const cat = CATS[p.cat];
    const card = document.createElement('div');
    card.className = 'card';
    let mediaHtml;
    if (p.photos && p.photos.length > 1) {
      mediaHtml = `<div style="display:flex; width:100%; height:100%; gap:2px;">
        ${p.photos.slice(0,2).map(src => `<img src="${src}" alt="${p.name}" style="width:50%;height:100%;object-fit:cover;">`).join('')}
      </div>`;
    } else if (p.photo || (p.photos && p.photos.length === 1)) {
      mediaHtml = `<img src="${p.photo || p.photos[0]}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover;">`;
    } else {
      mediaHtml = p.icon;
    }
    card.innerHTML = `
      <div class="card-top" style="background:${cat.color}1A;">${mediaHtml}</div>
      <div class="card-body">
        <p class="card-title serif">${p.name}</p>
        <span class="cat-badge" style="background:${cat.color}1A; color:${cat.color};">${cat.label}</span>
        <p class="desc">${p.desc}</p>
        <div class="actions">
          ${p.website ? `<a class="btn" href="${p.website}" target="_blank" rel="noopener">🌐 Website</a>` : ''}
          ${p.mapsId ? `<a class="btn primary" href="${mapsUrl(p)}" target="_blank" rel="noopener">📍 Google Maps</a>` : ''}
          ${p.phone ? `<a class="btn phone" href="tel:${p.phone.replace(/\s/g,'')}">📞 ${p.phone}</a>` : ''}
          ${p.facebook
            ? `<a class="btn social facebook" href="${p.facebook}" target="_blank" rel="noopener" title="Facebook"><i class="fa-brands fa-facebook-f"></i></a>`
            : `<span class="btn social inactive" title="Fără pagină Facebook"><i class="fa-brands fa-facebook-f"></i></span>`}
          ${p.instagram
            ? `<a class="btn social instagram" href="${p.instagram}" target="_blank" rel="noopener" title="Instagram"><i class="fa-brands fa-instagram"></i></a>`
            : `<span class="btn social inactive" title="Fără cont Instagram"><i class="fa-brands fa-instagram"></i></span>`}
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

function renderFilters(){
  const nav = document.getElementById('filters');
  const cats = ['toate', ...Object.keys(CATS)];
  cats.forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'chip' + (key === 'toate' ? ' active' : '');
    btn.textContent = key === 'toate' ? 'Toate' : CATS[key].label;
    btn.onclick = () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      render(key);
    };
    nav.appendChild(btn);
  });
}

loadPlaces();
</script>
</body>
</html>
